<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MS Render preview harness</title>
<style>
  body { background: #222; color: #ddd; font: 12px -apple-system, sans-serif; margin: 12px; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  iframe { width: 560px; height: 320px; border: 1px solid #555; }
  canvas { width: 560px; height: 320px; object-fit: contain; border: 1px solid #555; background: #111; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h3>GPU preview (left) vs CPU engine (right)</h3>
<div class="row"><iframe id="wv" src="../render/preview/index.html"></iframe><canvas id="cpu"></canvas></div>
<pre id="log"></pre>
<script>
// Load engine.js (CommonJS) into the page
const module = { exports: {} };
</script>
<script src="../render/engine.js"></script>
<script>
const E = module.exports;
const log = (s) => { document.getElementById("log").textContent += s + "\n"; };
function textAlpha(text, size) {
  const c = document.createElement("canvas"), ctx = c.getContext("2d");
  ctx.font = `${size}px Impact, "Arial Black", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width + size * 1.2), h = Math.ceil(size * 1.9);
  c.width = w; c.height = h;
  ctx.font = `${size}px Impact, "Arial Black", sans-serif`; ctx.fillStyle = "#fff"; ctx.textBaseline = "middle";
  ctx.fillText(text, size * 0.6, h / 2);
  const d = ctx.getImageData(0, 0, w, h).data, a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3];
  return { a, w, h };
}
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const P = Object.assign({}, E.DEFAULTS, JSON.parse(new URLSearchParams(location.search).get("p") || "{}"));
const { a, w, h } = textAlpha(new URLSearchParams(location.search).get("t") || "RETRO", 160);
const lay = E.layout(a, w, h, P);
const n = lay.need;
const padded = E.pad(a, w, h, n.left, n.top, n.right, n.bottom);
const box = Object.assign({}, lay.box, { x0: lay.box.x0 + n.left, y0: lay.box.y0 + n.top });
const t0 = performance.now();
const F = E.fields(padded.alpha, padded.w, padded.h, box.h);
log(`fields ${padded.w}x${padded.h}: ${(performance.now() - t0).toFixed(0)} ms`);
// CPU reference
const t1 = performance.now();
const rgba = E.renderChromeExtrude(padded.alpha, padded.w, padded.h, box, { x: lay.vp.x + n.left, y: lay.vp.y + n.top }, P, F);
log(`CPU render: ${(performance.now() - t1).toFixed(0)} ms`);
const cv = document.getElementById("cpu"); cv.width = padded.w; cv.height = padded.h;
const ctx = cv.getContext("2d"); ctx.fillStyle = "#1f1f1f"; ctx.fillRect(0, 0, padded.w, padded.h);
const tmp = document.createElement("canvas"); tmp.width = padded.w; tmp.height = padded.h;
tmp.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(rgba), padded.w, padded.h), 0, 0);
ctx.drawImage(tmp, 0, 0);
// GPU preview via postMessage
const frame = document.getElementById("wv");
window.addEventListener("message", (e) => { if (e.source === frame.contentWindow) log("preview: " + JSON.stringify(e.data)); });
frame.addEventListener("load", () => {
  // the preview posts to window.uxpHost – emulate it inside the iframe
  frame.contentWindow.uxpHost = { postMessage: (m) => log("preview: " + m) };
  const w2 = frame.contentWindow;
  w2.postMessage(JSON.stringify({ cmd: "source", w: padded.w, h: padded.h, box, alpha: b64(padded.alpha),
    dIn: b64(new Uint8Array(F.dIn.buffer)), dOut: b64(new Uint8Array(F.dOut.buffer)), sdfS: b64(new Uint8Array(F.sdfS.buffer)) }), "*");
  w2.postMessage(JSON.stringify({ cmd: "params", params: P, bg: 1 }), "*");
});
</script>
</body>
</html>
