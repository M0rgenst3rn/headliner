<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Headliner preview harness</title>
<style>
  body { background: #222; color: #ddd; font: 12px -apple-system, sans-serif; margin: 12px; }
  iframe { width: 420px; height: 210px; border: 1px solid #555; display: block; }
  button { margin: 2px; }
  #thumbs img { width: 100px; height: 64px; margin: 2px; border: 1px solid #444; }
  pre { white-space: pre-wrap; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
<h3>Headliner preview harness (emulates the panel)</h3>
<iframe id="wv" src="../render/preview/index.html"></iframe>
<div id="btns"></div>
<div id="thumbs"></div>
<pre id="log"></pre>
<script src="../render/preview/fx.js"></script>
<script>
const { FX } = window.HL;
const log = (s) => { const el = document.getElementById("log"); el.textContent = s + "\n" + el.textContent.slice(0, 4000); };
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
function textSource(text, size) {
  const c = document.createElement("canvas"), ctx = c.getContext("2d");
  ctx.font = `${size}px Impact, "Arial Black", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width + 4), h = Math.ceil(size * 1.05);
  c.width = w; c.height = h;
  ctx.font = `${size}px Impact, "Arial Black", sans-serif`; ctx.fillStyle = "#ff4696"; ctx.textBaseline = "top";
  ctx.fillText(text, 2, 2);
  const d = ctx.getImageData(0, 0, w, h).data, a = new Uint8Array(w * h), rgb = new Uint8Array(w * h * 3);
  for (let i = 0; i < w * h; i++) { a[i] = d[i * 4 + 3]; rgb[i * 3] = d[i * 4]; rgb[i * 3 + 1] = d[i * 4 + 1]; rgb[i * 3 + 2] = d[i * 4 + 2]; }
  return { a, rgb, w, h };
}
const params = new URLSearchParams(location.search);
const S = textSource(params.get("t") || "RETRO", 70);
const frame = document.getElementById("wv");
window.received = [];
let stack = params.get("combo") ? FX.comboStack(params.get("combo")) : FX.single(params.get("fx") || "chromeExtrude", {});
let sel = stack.entries[0].uid;
const post = (o) => frame.contentWindow.postMessage(JSON.stringify(o), "*");
const sendParams = () => post({ cmd: "params", stack, sel, bg: 0 });
function onMsg(m) {
  window.received.push(m);
  if (m.type === "thumb") { const img = document.createElement("img"); img.src = m.url; img.title = m.key; document.getElementById("thumbs").appendChild(img); return; }
  if (m.type === "drag") { const e = stack.entries.find((x) => x.uid === m.uid); if (e) Object.assign(e.values, m.values); }
  log(JSON.stringify(m).slice(0, 300));
}
frame.addEventListener("load", () => {
  frame.contentWindow.uxpHost = { postMessage: (s) => { let m = s; try { m = JSON.parse(s); } catch (e) { /* */ } onMsg(m); } };
  post({ cmd: "source", w: S.w, h: S.h, alpha: b64(S.a), rgb: b64(S.rgb) });
  sendParams();
  post({ cmd: "thumbs", tw: 200, th: 128, items: FX.EFFECTS.map((e) => ({ key: "fx:" + e.id, effect: e.id, values: {} }))
    .concat(Object.keys(FX.COMBOS).map((n) => ({ key: "combo:" + n, stack: FX.comboStack(n) }))) });
});
window.selectIndex = (i) => { sel = stack.entries[i].uid; sendParams(); };
for (const n of Object.keys(FX.COMBOS)) {
  const b = document.createElement("button"); b.textContent = "★ " + n;
  b.onclick = () => { stack = FX.comboStack(n); sel = stack.entries[0].uid; sendParams(); };
  document.getElementById("btns").appendChild(b);
}
for (const e of FX.EFFECTS) {
  const b = document.createElement("button"); b.textContent = e.name;
  b.onclick = () => { stack = FX.single(e.id, {}); sel = stack.entries[0].uid; sendParams(); };
  document.getElementById("btns").appendChild(b);
}
</script>
</body>
</html>
