<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
  <div class="top">
    <div class="header">
      <span class="title"><b>MS</b> RENDER</span>
      <span id="sourceName" class="layer-name">–</span>
    </div>
    <div class="subtitle">3D, light &amp; material effects for live text</div>

    <div id="previewBox" class="preview-box"></div>
    <div class="row between">
      <select id="bg" class="bg-select">
        <option value="0">Grey</option>
        <option value="1">Dark</option>
        <option value="4">Light</option>
        <option value="3">White</option>
        <option value="2">Transparent</option>
      </select>
      <label class="check live" title="Update the document while you change settings"><input type="checkbox" id="live"> Live</label>
      <label class="check" title="Re-render automatically when the text changes"><input type="checkbox" id="autoUpdate"> Auto-update</label>
    </div>

    <div class="actions">
      <sp-button size="s" variant="cta" id="render">Render</sp-button>
      <sp-button size="s" variant="secondary" id="remove">Remove</sp-button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="scroller">
  <div class="wrap">
    <div class="section first">
      <div class="section-title">Effects</div>
      <div id="fxGrid" class="fx-grid"></div>
    </div>

    <div class="section">
      <div class="section-title" id="lookTitle">Looks</div>
      <div id="lookGrid" class="fx-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Settings</div>
      <div class="effect-card">
        <span class="effect-name" id="effectName">–</span>
        <span class="effect-mode" id="effectMode"></span>
      </div>
      <div id="controls"></div>
      <div class="hint" id="controlsHint"></div>
      <label class="check"><input type="checkbox" id="expandCanvas"> Expand canvas when the effect doesn't fit</label>
    </div>

    <div class="section">
      <div class="section-title">Tools</div>
      <div class="row">
        <sp-action-button size="s" quiet id="resetAll">Reset effect</sp-action-button>
        <sp-action-button size="s" quiet id="selfTest" title="Creates a test document and checks every effect">Self-test</sp-action-button>
      </div>
    </div>
  </div>
  </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
