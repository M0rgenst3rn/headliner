<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #262626; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
  #ov { cursor: default; }
  #ov.drag { cursor: crosshair; }
  #msg { position: absolute; left: 6px; bottom: 4px; color: #888; font: 10px -apple-system, sans-serif; pointer-events: none; }
  #hint { position: absolute; right: 6px; top: 4px; color: rgba(255,255,255,0.55); font: 9px -apple-system, sans-serif; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2"></canvas>
<canvas id="ov"></canvas>
<div id="msg">Select a text or shape layer…</div>
<div id="hint"></div>
<script src="fx.js"></script>
<script>
// MS Render – live preview + gallery thumbnails.
// Chrome Extrude renders on the GPU (WebGL 2, milliseconds). All other effects use the shared CPU
// engine (fx.js = engine.js + effects.js) at preview size. A transparent overlay draws guides and
// lets the user drag the vanishing point / direction.
"use strict";
const { E, FX } = window.MSR;
const canvas = document.getElementById("c"), c2 = document.getElementById("c2"), ov = document.getElementById("ov");
const msg = document.getElementById("msg"), hint = document.getElementById("hint");
const gl = canvas.getContext("webgl2", { premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: false });
const send = (o) => { try { window.uxpHost.postMessage(JSON.stringify(o)); } catch (e) { /* no host (browser harness) */ if (window.onPreviewMessage) window.onPreviewMessage(o); } };

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;

// Pass 1: object (side walls + bevelled chrome front). Output: premultiplied RGB + coverage.
const FS_OBJ = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D tA, tIn, tOut, tSdf;
uniform vec2 size, vp; uniform float s, B, top, textH, scale, edgeK, specK; uniform int profile, sideMode;
uniform vec3 side1, side2;
uniform vec4 ramp[8];
out vec4 o;
float F(sampler2D t, vec2 p){ ivec2 q = ivec2(clamp(floor(p + 0.5), vec2(0.), size - 1.)); return texelFetch(t, q, 0).r; }
float bil(sampler2D t, vec2 p){
  p = clamp(p, vec2(0.), size - 1.001); vec2 i = floor(p), f = p - i;
  float a = texelFetch(t, ivec2(i), 0).r, b = texelFetch(t, ivec2(i) + ivec2(1, 0), 0).r;
  float c = texelFetch(t, ivec2(i) + ivec2(0, 1), 0).r, d = texelFetch(t, ivec2(i) + ivec2(1, 1), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec3 rampC(float u){
  u = clamp(u, 0., 1.); vec3 c = ramp[7].yzw;
  for (int i = 0; i < 7; i++) { if (u <= ramp[i + 1].x) { float t = (u - ramp[i].x) / max(1e-6, ramp[i + 1].x - ramp[i].x); return mix(ramp[i].yzw, ramp[i + 1].yzw, clamp(t, 0., 1.)); } }
  return c;
}
float hgt(vec2 p){ float d = bil(tIn, p) / B; if (d >= 1.) return 1.; return profile == 1 ? sqrt(1. - (1. - d) * (1. - d)) : d; }
void main(){
  vec2 x = vec2(floor(gl_FragCoord.x), size.y - 1. - floor(gl_FragCoord.y));
  vec3 L = normalize(vec3(-0.45, -0.75, 0.48));
  vec3 col = vec3(0.); float cov = 0.;
  if (s > 0.) {
    float t = 0.0005;
    for (int it = 0; it < 400; it++) {
      float tt = min(t, 1.), k = 1. - tt * s;
      vec2 p = (x - vp * tt * s) / k;
      vec2 c = clamp(p, vec2(0.), size - 1.);
      float off = length(p - c);
      float d = max(off, F(tOut, c) - off);
      if (d < 0.75 && off == 0.) {
        vec2 n = vec2(bil(tSdf, p + vec2(1, 0)) - bil(tSdf, p - vec2(1, 0)), bil(tSdf, p + vec2(0, 1)) - bil(tSdf, p - vec2(0, 1)));
        n = length(n) > 0. ? normalize(n) : vec2(0.);
        bool cap = t >= 1.;
        if (cap) n = vec2(0.);
        float lam = max(0., dot(n, L.xy));
        vec3 rc = sideMode == 1 ? mix(side1, side2, tt) : rampC(0.5 + 0.32 * n.y + 0.22 * tt);
        float shade = cap ? 0.35 : (0.45 + 0.75 * lam) * (1. - 0.45 * tt);
        col = rc * shade; cov = 1.;
        break;
      }
      if (t >= 1.) break;
      float speed = s * length(vp - p) / k;
      t += max(0.0015, (d * 0.9) / max(speed, 1e-3));
    }
  }
  float a = texelFetch(tA, ivec2(x), 0).r;
  if (a > 0.) {
    float hx = (hgt(x + vec2(1, 0)) - hgt(x - vec2(1, 0))) * B * 0.5;
    float hy = (hgt(x + vec2(0, 1)) - hgt(x - vec2(0, 1))) * B * 0.5;
    vec3 n = normalize(vec3(-hx, -hy, 1.));
    vec3 c2 = rampC((x.y - top) / textH + n.y * 0.55);
    vec3 H = normalize(vec3(L.xy, L.z + 1.));
    float spec = pow(max(0., dot(n, H)), 60.) * specK;
    float edge = 1. - edgeK * (1. - clamp((texelFetch(tIn, ivec2(x), 0).r - 0.5) / (1.5 * max(1., scale)), 0., 1.));
    vec3 fr = min(vec3(1.), (c2 + spec) * edge);
    col = col * (1. - a) + fr * a; cov = max(cov, a);
  }
  o = vec4(col * cov, cov);
}`;

// Pass 2: outline + hard shadow + background.
const FS_COMP = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D tObj; uniform vec2 size; uniform float sw, sw2, shOp; uniform vec2 sh; uniform int R, bg, hasStroke;
uniform vec3 strokeCol, stroke2Col, shadowCol;
out vec4 o;
float covAt(ivec2 q){ if (q.x < 0 || q.y < 0 || q.x >= int(size.x) || q.y >= int(size.y)) return 0.; return texelFetch(tObj, q, 0).a; }
float distU(ivec2 c){ float m = 1e3; for (int dy = -R; dy <= R; dy++) for (int dx = -R; dx <= R; dx++) { if (covAt(c + ivec2(dx, dy)) >= 0.5) m = min(m, length(vec2(dx, dy))); } return m; }
vec3 background(vec2 uv){
  if (bg == 1) return vec3(0.12);
  if (bg == 2) { vec2 g = floor(gl_FragCoord.xy / 10.); return mod(g.x + g.y, 2.) < 1. ? vec3(0.85) : vec3(1.); }
  if (bg == 3) return vec3(1.);
  if (bg == 4) return vec3(0.93);
  // neutral studio grey with a soft centre light
  float r = length((uv - 0.5) * vec2(1.6, 1.));
  return mix(vec3(0.235), vec3(0.165), clamp(r, 0., 1.));
}
void main(){
  ivec2 q = ivec2(gl_FragCoord.xy);
  vec3 c = background(gl_FragCoord.xy / size);
  float swAll = (hasStroke == 1 ? sw : 0.) + sw2;
  if (sh != vec2(0.)) { float d = distU(q - ivec2(int(sh.x), -int(sh.y))); float a = clamp(max(sw, swAll) + 1. - d, 0., 1.) * shOp; c = mix(c, shadowCol, a); }
  float du = (hasStroke == 1 || sw2 > 0.) ? distU(q) : 1e3;
  if (sw2 > 0.) { float a = clamp(swAll + 0.5 - du, 0., 1.); c = mix(c, stroke2Col, a); }
  if (hasStroke == 1) { float a = clamp(sw + 0.5 - du, 0., 1.); c = mix(c, strokeCol, a); }
  vec4 obj = texelFetch(tObj, q, 0);
  c = c * (1. - obj.a) + obj.rgb;
  o = vec4(c, 1.);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let progObj = null, progComp = null;
const tex = {};
let fbo = null, fboTex = null;
try {
  if (!gl) throw new Error("WebGL 2 not available");
  progObj = program(FS_OBJ); progComp = program(FS_COMP);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
} catch (e) { send({ type: "error", error: "GPU: " + String(e.message || e) }); }

function b64ToBytes(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function upload(name, data, w, h, isFloat) {
  if (!tex[name]) tex[name] = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex[name]);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  if (isFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, w, h, 0, gl.RED, gl.FLOAT, data);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

// ---------------------------------------------------------------- state
let src = null;            // { alpha, rgb, w, h } preview-size source (unpadded)
let stack = null;          // { entries: [{ uid, effect, values, on }] } – top → bottom
let state = null;          // the selected entry (its values are edited by dragging)
let bg = 0;
let geo = null;            // what is on screen: { w, h, box, vp?, fx }
let gpuPad = null;         // padding currently uploaded for the GPU path
let dragging = false;
let cpuFrame = null;        // fixed CPU preview frame during a drag

// sample text when nothing is selected (gallery)
function sampleSource(text) {
  const cv = document.createElement("canvas"), x = cv.getContext("2d");
  x.font = "100px Impact, 'Arial Black', sans-serif";
  const w = Math.ceil(x.measureText(text).width) + 8, h = 112;
  cv.width = w; cv.height = h;
  x.font = "100px Impact, 'Arial Black', sans-serif"; x.fillStyle = "rgb(235,235,235)"; x.textBaseline = "alphabetic";
  x.fillText(text, 4, 102);
  return fromImageData(x.getImageData(0, 0, w, h));
}
function fromImageData(id) {
  const n = id.width * id.height, alpha = new Uint8Array(n), rgb = new Uint8Array(n * 3), d = id.data;
  for (let i = 0; i < n; i++) { alpha[i] = d[i * 4 + 3]; rgb[i * 3] = d[i * 4]; rgb[i * 3 + 1] = d[i * 4 + 1]; rgb[i * 3 + 2] = d[i * 4 + 2]; }
  return { alpha, rgb, w: id.width, h: id.height };
}
function toCanvas(s) {
  const cv = document.createElement("canvas"); cv.width = s.w; cv.height = s.h;
  const x = cv.getContext("2d"), id = x.createImageData(s.w, s.h);
  for (let i = 0; i < s.w * s.h; i++) { id.data[i * 4] = s.rgb[i * 3]; id.data[i * 4 + 1] = s.rgb[i * 3 + 1]; id.data[i * 4 + 2] = s.rgb[i * 3 + 2]; id.data[i * 4 + 3] = s.alpha[i]; }
  x.putImageData(id, 0, 0);
  return cv;
}
function rgbaCanvas(rgba, w, h) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const x = cv.getContext("2d"), id = x.createImageData(w, h);
  id.data.set(rgba); x.putImageData(id, 0, 0);
  return cv;
}
// 2D version of the shader backgrounds
function paintBg(x, w, h, kind) {
  if (kind === 1) { x.fillStyle = "#1f1f1f"; x.fillRect(0, 0, w, h); return; }
  if (kind === 3) { x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); return; }
  if (kind === 2) { for (let y = 0; y < h; y += 10) for (let xx = 0; xx < w; xx += 10) { x.fillStyle = ((xx + y) / 10) % 2 ? "#fff" : "#d9d9d9"; x.fillRect(xx, y, 10, 10); } return; }
  if (kind === 4) { x.fillStyle = "#ededed"; x.fillRect(0, 0, w, h); return; }
  // neutral studio grey with a soft centre light (kind 0 = preview, 9 = gallery tiles)
  const g = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.62);
  g.addColorStop(0, kind === 9 ? "#333333" : "#3c3c3c"); g.addColorStop(1, kind === 9 ? "#262626" : "#2a2a2a");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
}

// ---------------------------------------------------------------- rendering
function sizeCanvases(w, h) {
  for (const cv of [canvas, c2, ov]) if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}
function renderGPU(v) {
  const lay = E.layout(src.alpha, src.w, src.h, v);
  if (!lay) return;
  const extra = Math.ceil(lay.box.h * 0.35), n = lay.need;
  const want = { l: n.left + extra, t: n.top + extra, r: n.right + extra, b: n.bottom + extra };
  // re-pad only when needed (and never shrink while dragging – keeps the mapping stable)
  const p0 = gpuPad;
  const fits = p0 && p0.src === src && want.l <= p0.l && want.t <= p0.t && want.r <= p0.r && want.b <= p0.b;
  const tooBig = p0 && !dragging && (p0.l + p0.r + p0.t + p0.b) > 1.6 * (want.l + want.r + want.t + want.b) + 40;
  if (!fits || tooBig) {
    const pad = dragging && p0 && p0.src === src ? { l: Math.max(want.l, p0.l), t: Math.max(want.t, p0.t), r: Math.max(want.r, p0.r), b: Math.max(want.b, p0.b) } : want;
    const P = E.pad(src.alpha, src.w, src.h, pad.l, pad.t, pad.r, pad.b);
    const box = { x0: lay.box.x0 + pad.l, y0: lay.box.y0 + pad.t, w: lay.box.w, h: lay.box.h };
    const F = E.fields(P.alpha, P.w, P.h, box.h);
    upload("a", P.alpha, P.w, P.h, false);
    upload("in", F.dIn, P.w, P.h, true);
    upload("out", F.dOut, P.w, P.h, true);
    upload("sdf", F.sdfS, P.w, P.h, true);
    if (!fboTex) { fboTex = gl.createTexture(); fbo = gl.createFramebuffer(); }
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, P.w, P.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gpuPad = Object.assign({ src, w: P.w, h: P.h, box }, pad);
  }
  const W = gpuPad.w, H = gpuPad.h, box = gpuPad.box, textH = box.h;
  sizeCanvases(W, H);
  const vp = [box.x0 + v.vpX / 100 * box.w, box.y0 + v.vpY / 100 * box.h];
  const ramp = E.rampFor(v).flatMap(([u, c]) => [u, ((c >> 16) & 255) / 255, ((c >> 8) & 255) / 255, (c & 255) / 255]);
  const rgb3 = (h) => { const n = E.hexInt(h); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
  const uni = (p, name) => gl.getUniformLocation(p, name);
  gl.viewport(0, 0, W, H);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.useProgram(progObj);
  const bind = (unit, t, name) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex[t]); gl.uniform1i(uni(progObj, name), unit); };
  bind(0, "a", "tA"); bind(1, "in", "tIn"); bind(2, "out", "tOut"); bind(3, "sdf", "tSdf");
  gl.uniform2f(uni(progObj, "size"), W, H);
  gl.uniform2f(uni(progObj, "vp"), vp[0], vp[1]);
  gl.uniform1f(uni(progObj, "s"), v.depth / 100);
  gl.uniform1f(uni(progObj, "B"), Math.max(2, v.bevel / 100 * textH));
  gl.uniform1f(uni(progObj, "top"), box.y0);
  gl.uniform1f(uni(progObj, "textH"), textH);
  gl.uniform1f(uni(progObj, "scale"), textH / 300);
  gl.uniform1f(uni(progObj, "edgeK"), v.edgeLine / 100);
  gl.uniform1i(uni(progObj, "profile"), v.profile === "round" ? 1 : 0);
  gl.uniform1i(uni(progObj, "sideMode"), v.sideMode === "solid" ? 1 : 0);
  gl.uniform3fv(uni(progObj, "side1"), rgb3(v.sideColor));
  gl.uniform3fv(uni(progObj, "side2"), rgb3(v.sideColor2));
  gl.uniform1f(uni(progObj, "specK"), (v.shine === undefined ? 70 : v.shine) / 100 * 2);
  gl.uniform4fv(uni(progObj, "ramp"), new Float32Array(ramp));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(uni(progComp, "tObj"), 0);
  // same rules as the CPU engine (engine.js, outline + shadow)
  const sw = Math.max(1.5, v.stroke / 100 * textH), sw2 = v.stroke2 > 0 ? Math.max(1, v.stroke2 / 100 * textH) : 0;
  const swAll = (v.stroke > 0 ? sw : 0) + sw2;
  gl.uniform2f(uni(progComp, "size"), W, H);
  gl.uniform1f(uni(progComp, "sw"), sw);
  gl.uniform1f(uni(progComp, "sw2"), sw2);
  gl.uniform1i(uni(progComp, "hasStroke"), v.stroke > 0 ? 1 : 0);
  gl.uniform1f(uni(progComp, "shOp"), (v.shadowOpacity === undefined ? 85 : v.shadowOpacity) / 100);
  gl.uniform3fv(uni(progComp, "strokeCol"), rgb3(v.strokeColor));
  gl.uniform3fv(uni(progComp, "stroke2Col"), rgb3(v.stroke2Color));
  gl.uniform3fv(uni(progComp, "shadowCol"), rgb3(v.shadowColor));
  gl.uniform2f(uni(progComp, "sh"), Math.round(v.shadowX / 100 * textH), Math.round(v.shadowY / 100 * textH));
  gl.uniform1i(uni(progComp, "R"), Math.min(24, Math.ceil(Math.max(sw, swAll) + 2)));
  gl.uniform1i(uni(progComp, "bg"), bg);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // wait for GPU
  geo = { w: W, h: H, box, vp: { x: vp[0], y: vp[1] }, fx: FX.BY_ID.chromeExtrude, uid: null };
}
// CPU path: render the whole stack, then composite bottom-up over the background:
// behind-effects, source (if visible), base, above-effects (layers come top → bottom)
function drawStack(x, s, res, ox, oy) {
  const L = res.layers, draw = (l) => x.drawImage(rgbaCanvas(l.rgba, l.w, l.h), ox + l.x, oy + l.y);
  for (const l of L.filter((l) => l.zone === "behind").reverse()) draw(l);
  if (res.sourceVisible) x.drawImage(toCanvas(s), ox, oy);
  for (const l of L.filter((l) => l.zone === "base")) draw(l);
  for (const l of L.filter((l) => l.zone === "above").reverse()) draw(l);
}
function renderCPU() {
  const res = FX.renderStack(src, stack);
  const b = FX.stackBounds(res, src);
  // While dragging the frame stays fixed (otherwise the canvas grows with the effect and the point
  // under the mouse runs away); afterwards it is fitted to the stack again.
  let W, H, sx, sy;
  const f = cpuFrame;
  if (dragging && f && f.src === src) ({ W, H, sx, sy } = f);
  else {
    const extra = Math.ceil(src.h * 0.25 + 6);
    W = b.x1 - b.x0 + 2 * extra; H = b.y1 - b.y0 + 2 * extra; sx = extra - b.x0; sy = extra - b.y0;
    cpuFrame = { W, H, sx, sy, src };
  }
  sizeCanvases(W, H);
  const x = c2.getContext("2d");
  x.clearRect(0, 0, W, H);
  paintBg(x, W, H, bg);
  drawStack(x, src, res, sx, sy);
  // guides follow the selected effect
  const lay = state && res.layers.find((l) => l.uid === state.uid);
  if (!lay) { geo = { w: W, h: H, box: null, fx: null }; return; }
  const box = { x0: lay.box.x0 + sx, y0: lay.box.y0 + sy, w: lay.box.w, h: lay.box.h };
  const fx = FX.BY_ID[lay.effect];
  geo = { w: W, h: H, box, fx, uid: lay.uid };
  if (fx.drag === "vp") geo.vp = { x: box.x0 + state.values.vpX / 100 * box.w, y: box.y0 + state.values.vpY / 100 * box.h };
}
let pending = false;
function render() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    if (!src || !stack) return;
    const t0 = performance.now();
    // a single Chrome Extrude renders on the GPU in milliseconds; everything else on the CPU engine
    const on = stack.entries.filter((e) => e.on);
    // very wide outlines exceed the shader's sample radius → the CPU engine draws those exactly
    const wideStroke = (v) => { const H = src.h, sw = Math.max(1.5, v.stroke / 100 * H), sw2 = v.stroke2 > 0 ? Math.max(1, v.stroke2 / 100 * H) : 0; return Math.max(sw, (v.stroke > 0 ? sw : 0) + sw2) + 2 > 24; };
    const gpuEntry = on.length === 1 && FX.BY_ID[on[0].effect].gpu && progObj && !wideStroke(on[0].values) ? on[0] : null;
    try {
      if (gpuEntry) { renderGPU(gpuEntry.values); geo.uid = gpuEntry.uid; } else renderCPU();
    } catch (e) { send({ type: "error", error: String(e && e.stack || e) }); }
    canvas.style.visibility = gpuEntry ? "visible" : "hidden";
    c2.style.visibility = gpuEntry ? "hidden" : "visible";
    ov.style.visibility = "visible";
    drawGuides();
    msg.textContent = "";
    send({ type: "rendered", ms: +(performance.now() - t0).toFixed(1), layers: on.length, gpu: !!gpuEntry });
  });
}

// ---------------------------------------------------------------- guides + dragging
function drawGuides() {
  const x = ov.getContext("2d");
  x.clearRect(0, 0, ov.width, ov.height);
  if (!geo || !geo.fx || !geo.box || !state || geo.uid !== state.uid) { hint.textContent = ""; ov.className = ""; return; }
  const fx = geo.fx, v = state.values, b = geo.box, kind = dragKind();
  hint.textContent = { vp: "drag: vanishing point", dir: "drag: direction", ab: "drag: bolt start / end", pt: "drag: light source" }[kind] || "";
  ov.className = kind ? "drag" : "";
  if (!kind) return;
  const lw = Math.max(1, geo.w / 300);
  x.lineWidth = lw;
  if (fx.drag === "vp") {
    const vp = geo.vp;
    x.setLineDash([4 * lw, 4 * lw]);
    x.strokeStyle = "rgba(255,255,255,0.45)";
    for (const [cx, cy] of [[b.x0, b.y0], [b.x0 + b.w, b.y0], [b.x0, b.y0 + b.h], [b.x0 + b.w, b.y0 + b.h]]) { x.beginPath(); x.moveTo(cx, cy); x.lineTo(vp.x, vp.y); x.stroke(); }
    x.setLineDash([]);
    marker(x, vp.x, vp.y, lw);
  } else if (kind === "pt") {
    const px = b.x0 + v.lx / 100 * b.w, py = b.y0 + v.ly / 100 * b.h, R = v.size / 100 * b.h;
    x.setLineDash([4 * lw, 4 * lw]); x.strokeStyle = "rgba(255,255,255,0.4)";
    x.beginPath(); x.arc(px, py, Math.max(4, R), 0, Math.PI * 2); x.stroke(); x.setLineDash([]);
    marker(x, px, py, lw);
  } else if (kind === "ab") {
    const [A, B] = abPoints();
    x.setLineDash([4 * lw, 4 * lw]); x.strokeStyle = "rgba(255,255,255,0.35)";
    x.beginPath(); x.moveTo(A.x, A.y); x.lineTo(B.x, B.y); x.stroke(); x.setLineDash([]);
    marker(x, A.x, A.y, lw); marker(x, B.x, B.y, lw);
    x.fillStyle = "#fff"; x.font = `${Math.round(9 * lw)}px -apple-system, sans-serif`;
    x.fillText("A", A.x + 9 * lw, A.y - 7 * lw); x.fillText("B", B.x + 9 * lw, B.y - 7 * lw);
  } else {
    const cx = b.x0 + b.w / 2, cy = b.y0 + b.h / 2, a = v.angle * Math.PI / 180;
    const len = (v.distance !== undefined ? v.distance * (v.copies || 1) : v.length) / 100 * b.h;   // Retro Stack: all copies
    const ex = cx + Math.cos(a) * len, ey = cy + Math.sin(a) * len;
    x.strokeStyle = "rgba(255,255,255,0.9)"; x.lineWidth = 2 * lw;
    x.beginPath(); x.moveTo(cx, cy); x.lineTo(ex, ey); x.stroke();
    const ah = 7 * lw;
    x.beginPath(); x.moveTo(ex, ey); x.lineTo(ex - Math.cos(a - 0.45) * ah, ey - Math.sin(a - 0.45) * ah); x.moveTo(ex, ey); x.lineTo(ex - Math.cos(a + 0.45) * ah, ey - Math.sin(a + 0.45) * ah); x.stroke();
    x.fillStyle = "rgba(255,255,255,0.9)"; x.beginPath(); x.arc(cx, cy, 2.5 * lw, 0, Math.PI * 2); x.fill();
    marker(x, ex, ey, lw);
  }
}
// lightning "point to point" has draggable A/B handles; its "out of the text" mode has none
function dragKind() {
  if (!geo || !geo.fx || !geo.box || !state || geo.uid !== state.uid) return null;
  const fx = geo.fx;
  if (fx.drag === "ab" && state.values.style !== "points") return null;
  return fx.drag || null;
}
function abPoints() {
  const b = geo.box, v = state.values;
  return [{ x: b.x0 + v.ax / 100 * b.w, y: b.y0 + v.ay / 100 * b.h }, { x: b.x0 + v.bx / 100 * b.w, y: b.y0 + v.by / 100 * b.h }];
}
let abHandle = "b";
function marker(x, px, py, lw) {
  x.strokeStyle = "#000"; x.lineWidth = 3 * lw; x.beginPath(); x.arc(px, py, 6 * lw, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = "#ffffff"; x.lineWidth = 1.6 * lw; x.beginPath(); x.arc(px, py, 6 * lw, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.moveTo(px - 10 * lw, py); x.lineTo(px + 10 * lw, py); x.moveTo(px, py - 10 * lw); x.lineTo(px, py + 10 * lw); x.stroke();
}
function toCanvasXY(e) {
  const r = ov.getBoundingClientRect(), k = Math.min(r.width / ov.width, r.height / ov.height);
  const ox = (r.width - ov.width * k) / 2, oy = (r.height - ov.height * k) / 2;
  return { x: (e.clientX - r.left - ox) / k, y: (e.clientY - r.top - oy) / k };
}
function dragTo(e) {
  if (!dragKind()) return; // nothing draggable / screen still shows another effect
  const fx = geo.fx, b = geo.box, p = toCanvasXY(e);
  let upd = null;
  if (fx.drag === "vp") upd = { vpX: Math.round((p.x - b.x0) / b.w * 100 / 5) * 5, vpY: Math.round((p.y - b.y0) / b.h * 100 / 5) * 5 };
  else if (fx.drag === "dir") upd = FX.BY_ID[fx.id].dragApply(state.values, p.x - (b.x0 + b.w / 2), p.y - (b.y0 + b.h / 2), b);
  else if (fx.drag === "pt") upd = { lx: Math.max(-100, Math.min(200, Math.round((p.x - b.x0) / b.w * 100))), ly: Math.max(-200, Math.min(300, Math.round((p.y - b.y0) / b.h * 100))) };
  else if (dragKind() === "ab") {
    if (e.type === "pointerdown") { const [A, B] = abPoints(); abHandle = Math.hypot(p.x - A.x, p.y - A.y) < Math.hypot(p.x - B.x, p.y - B.y) ? "a" : "b"; }
    const px = Math.max(-300, Math.min(400, Math.round((p.x - b.x0) / b.w * 100))), py = Math.max(-400, Math.min(500, Math.round((p.y - b.y0) / b.h * 100)));
    upd = abHandle === "a" ? { ax: px, ay: py } : { bx: px, by: py };
  }
  if (!upd) return;
  Object.assign(state.values, upd);
  render();
  send({ type: "drag", uid: state.uid, effect: state.effect, values: upd, final: e.type === "pointerup" });
}
ov.addEventListener("pointerdown", (e) => { if (!dragKind()) return; dragging = true; try { ov.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } dragTo(e); });
ov.addEventListener("pointermove", (e) => { if (dragging) dragTo(e); });
ov.addEventListener("pointerup", (e) => { if (!dragging) return; dragTo(e); dragging = false; render(); });

// ---------------------------------------------------------------- gallery thumbnails
// Renders each item {key, effect, values} on the current source (or a sample) into a tile and
// returns a PNG data URL to the panel. Done one tile per tick so the preview stays responsive.
function scaledSource(s, tw, th, effect, zoom) {
  // fit the text box into the tile, leaving room for the effect
  const lay = FX.layoutFor(s.alpha, s.w, s.h, "glow", FX.values("glow", { size: 0.1 }));
  const b = lay ? lay.box : { x0: 0, y0: 0, w: s.w, h: s.h };
  const k = Math.min(tw * 0.74 / Math.max(1, b.w), th * 0.42 / Math.max(1, b.h)) * (zoom || 1);
  const cv = document.createElement("canvas"); cv.width = tw; cv.height = th;
  const x = cv.getContext("2d");
  const up = effect === "lightning" ? 0.1 : effect === "fire" || effect === "smoke" ? 0.17 : 0;
  const cx = tw / 2 - (b.x0 + b.w / 2) * k, cy = th * (0.5 + up) - (b.y0 + b.h / 2) * k;
  x.imageSmoothingQuality = "high";
  x.drawImage(toCanvas(s), cx, cy, s.w * k, s.h * k);
  return fromImageData(x.getImageData(0, 0, tw, th));
}
// Thumbnail requests are queued (a new request replaces queued items with the same key but never
// cancels the rest) – so the gallery always fills up, even while the stack is being edited.
const thumbQueue = [];
let thumbBusy = false, thumbSize = { tw: 200, th: 124 };
function makeThumbs(m) {
  thumbSize = { tw: m.tw, th: m.th };
  const keys = new Set(m.items.map((it) => it.key));
  for (let i = thumbQueue.length - 1; i >= 0; i--) if (keys.has(thumbQueue[i].key)) thumbQueue.splice(i, 1);
  thumbQueue.push(...m.items);
  if (!thumbBusy) { thumbBusy = true; setTimeout(thumbStep, 0); }
}
function thumbStep() {
  const m = thumbSize;
  const base = src || sampleSource("Ab");
  const items = thumbQueue;
  if (!items.length) { thumbBusy = false; return; }
  const it = items.shift();
  try {
    // an item is a single effect ({ effect, values }) or a combo ({ stack })
    let st = it.stack;
    if (!st) { const fx = FX.BY_ID[it.effect]; st = FX.single(it.effect, Object.assign({}, fx.thumb || {}, it.values)); }
    st = FX.normStack(st);
    const ids = st.entries.map((e) => e.effect);
    const look = ids.includes("lightning") ? "lightning" : ids.includes("fire") || ids.includes("smoke") ? "fire" : ids[0];
    const s = scaledSource(base, m.tw, m.th, look, it.stack ? 0.85 : 1);
    if (it.stack) for (const e of st.entries) { const t = FX.BY_ID[e.effect].thumb; if (t) Object.assign(e.values, t); }
    const res = FX.renderStack(s, st);
    const cv = document.createElement("canvas"); cv.width = m.tw; cv.height = m.th;
    const x = cv.getContext("2d");
    paintBg(x, m.tw, m.th, 9);
    drawStack(x, s, res, 0, 0);   // s is already tile-sized, so it sits at 0,0
    send({ type: "thumb", key: it.key, url: cv.toDataURL("image/png") });
  } catch (e) { send({ type: "error", error: "thumb " + it.key + ": " + String(e && e.message || e) }); }
  setTimeout(thumbStep, 0);
}

// ---------------------------------------------------------------- messages
function handle(m) {
  if (m.cmd === "ping") send({ type: "pong" });
  else if (m.cmd === "source") {
    const alpha = b64ToBytes(m.alpha), rgb = m.rgb ? b64ToBytes(m.rgb) : null;
    src = { alpha, rgb: rgb || new Uint8Array(m.w * m.h * 3).fill(128), w: m.w, h: m.h };
    gpuPad = null;
    send({ type: "sourceLoaded", w: m.w, h: m.h });
    render();
  }
  else if (m.cmd === "params") {
    if (!dragging) {
      stack = FX.normStack(m.stack);
      state = stack.entries.find((e) => e.uid === m.sel) || null;
    }
    bg = m.bg | 0; render();
  }
  else if (m.cmd === "thumbs") makeThumbs(m);
  else if (m.cmd === "clear") {
    src = null; geo = null; gpuPad = null;
    for (const cv of [canvas, c2, ov]) cv.style.visibility = "hidden";
    hint.textContent = ""; msg.textContent = m.text || "";
  }
}
window.addEventListener("message", (e) => {
  let m = e.data;
  for (let k = 0; k < 3 && typeof m === "string"; k++) { try { m = JSON.parse(m); } catch (err) { break; } }
  if (!m || !m.cmd) return;
  try { handle(m); } catch (err) { send({ type: "error", error: String(err && err.stack || err) }); }
});
window.previewHandle = handle; // browser harness
ov.style.visibility = "visible";
send({ type: "ready" });
</script>
</body>
</html>
