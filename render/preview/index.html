<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #1d1d1d; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  #msg { position: absolute; left: 6px; bottom: 4px; color: #888; font: 10px -apple-system, sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Select a text or shape layer…</div>
<script>
// MS Render – GPU live preview (WebGL 2). Receives the source (alpha + distance fields) once,
// then re-renders in milliseconds whenever parameters change.
"use strict";
const canvas = document.getElementById("c");
const msg = document.getElementById("msg");
const gl = canvas.getContext("webgl2", { premultipliedAlpha: false, preserveDrawingBuffer: true, antialias: false });
const send = (o) => { try { window.uxpHost.postMessage(JSON.stringify(o)); } catch (e) { /* no host */ } };

const RAMPS = {
  chrome: [[0, 0x0a1440], [0.28, 0x3f7fd8], [0.46, 0xdff2ff], [0.5, 0xffffff], [0.505, 0x2c1a0c], [0.68, 0xa86a34], [0.88, 0xf2d6a6], [1, 0x4a2c16]],
  gold: [[0, 0x3a1a00], [0.3, 0xb8741a], [0.46, 0xfff1b8], [0.5, 0xffffff], [0.505, 0x5a3200], [0.7, 0xd9a03a], [0.9, 0xfff0b0], [1, 0x6a3c08]],
  silver: [[0, 0x1a1c22], [0.28, 0x8a929e], [0.46, 0xf2f4f8], [0.5, 0xffffff], [0.505, 0x2a2c30], [0.68, 0x7a7e86], [0.88, 0xd8dce2], [1, 0x30333a]],
};

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;

// Pass 1: object (side walls + bevelled chrome front). Output: premultiplied RGB + coverage.
const FS_OBJ = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D tA, tIn, tOut, tSdf;
uniform vec2 size, vp; uniform float s, B, top, textH, scale, edgeK; uniform int profile;
uniform vec4 ramp[8];
out vec4 o;
float F(sampler2D t, vec2 p){ ivec2 q = ivec2(clamp(floor(p + 0.5), vec2(0.), size - 1.)); return texelFetch(t, q, 0).r; }
float bil(sampler2D t, vec2 p){
  p = clamp(p, vec2(0.), size - 1.001); vec2 i = floor(p), f = p - i;
  float a = texelFetch(t, ivec2(i), 0).r, b = texelFetch(t, ivec2(i) + ivec2(1, 0), 0).r;
  float c = texelFetch(t, ivec2(i) + ivec2(0, 1), 0).r, d = texelFetch(t, ivec2(i) + ivec2(1, 1), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec3 rampC(float u){
  u = clamp(u, 0., 1.); vec3 c = ramp[7].yzw;
  for (int i = 0; i < 7; i++) { if (u <= ramp[i + 1].x) { float t = (u - ramp[i].x) / max(1e-6, ramp[i + 1].x - ramp[i].x); return mix(ramp[i].yzw, ramp[i + 1].yzw, clamp(t, 0., 1.)); } }
  return c;
}
float hgt(vec2 p){ float d = bil(tIn, p) / B; if (d >= 1.) return 1.; return profile == 1 ? sqrt(1. - (1. - d) * (1. - d)) : d; }
void main(){
  vec2 x = vec2(floor(gl_FragCoord.x), size.y - 1. - floor(gl_FragCoord.y));
  vec3 L = normalize(vec3(-0.45, -0.75, 0.48));
  vec3 col = vec3(0.); float cov = 0.;
  // side walls: march toward the vanishing point (sphere tracing on the outside distance field)
  if (s > 0.) {
    float t = 0.0005;
    for (int it = 0; it < 400; it++) {
      float tt = min(t, 1.), k = 1. - tt * s;
      vec2 p = (x - vp * tt * s) / k;
      vec2 c = clamp(p, vec2(0.), size - 1.);
      float off = length(p - c);
      float d = max(off, F(tOut, c) - off);
      if (d < 0.75 && off == 0.) {
        vec2 n = vec2(bil(tSdf, p + vec2(1, 0)) - bil(tSdf, p - vec2(1, 0)), bil(tSdf, p + vec2(0, 1)) - bil(tSdf, p - vec2(0, 1)));
        n = length(n) > 0. ? normalize(n) : vec2(0.);
        bool cap = t >= 1.;
        if (cap) n = vec2(0.);
        float lam = max(0., dot(n, L.xy));
        vec3 rc = rampC(0.5 + 0.32 * n.y + 0.22 * tt);
        float shade = cap ? 0.35 : (0.45 + 0.75 * lam) * (1. - 0.45 * tt);
        col = rc * shade; cov = 1.;
        break;
      }
      if (t >= 1.) break;
      float speed = s * length(vp - p) / k;
      t += max(0.0015, (d * 0.9) / max(speed, 1e-3));
    }
  }
  float a = texelFetch(tA, ivec2(x), 0).r;
  if (a > 0.) {
    float hx = (hgt(x + vec2(1, 0)) - hgt(x - vec2(1, 0))) * B * 0.5;
    float hy = (hgt(x + vec2(0, 1)) - hgt(x - vec2(0, 1))) * B * 0.5;
    vec3 n = normalize(vec3(-hx, -hy, 1.));
    vec3 c2 = rampC((x.y - top) / textH + n.y * 0.55);
    vec3 H = normalize(vec3(L.xy, L.z + 1.));
    float spec = pow(max(0., dot(n, H)), 60.) * 1.4;
    float edge = 1. - edgeK * (1. - clamp((texelFetch(tIn, ivec2(x), 0).r - 0.5) / (1.5 * max(1., scale)), 0., 1.));
    vec3 fr = min(vec3(1.), (c2 + spec) * edge);
    col = col * (1. - a) + fr * a; cov = max(cov, a);
  }
  o = vec4(col * cov, cov);
}`;

// Pass 2: outline + hard shadow + background.
const FS_COMP = `#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D tObj; uniform vec2 size; uniform float sw; uniform vec2 sh; uniform int R; uniform int bg;
out vec4 o;
float covAt(ivec2 q){ if (q.x < 0 || q.y < 0 || q.x >= int(size.x) || q.y >= int(size.y)) return 0.; return texelFetch(tObj, q, 0).a; }
float distU(ivec2 c){ float m = 1e3; for (int dy = -R; dy <= R; dy++) for (int dx = -R; dx <= R; dx++) { if (covAt(c + ivec2(dx, dy)) >= 0.5) m = min(m, length(vec2(dx, dy))); } return m; }
vec3 background(vec2 uv){
  if (bg == 1) return vec3(0.12);
  if (bg == 2) { vec2 g = floor(gl_FragCoord.xy / 10.); return mod(g.x + g.y, 2.) < 1. ? vec3(0.85) : vec3(1.); }
  if (bg == 3) return vec3(1.);
  float y = 1. - uv.y;  // retro sunset + grid
  vec3 c = y < 0.62 ? mix(vec3(0.12, 0.04, 0.27), vec3(0.88, 0.2, 0.5), y / 0.62) : mix(vec3(0.16, 0.03, 0.2), vec3(0.08, 0.03, 0.16), (y - 0.62) / 0.38);
  if (y > 0.62) { float k = (y - 0.62) / 0.38; float rows = fract(sqrt(k) * 9.); float cols = fract((uv.x - 0.5) / max(0.02, k) * 6.); if (rows < 0.06 || cols < 0.03) c = mix(c, vec3(1., 0.24, 0.8), 0.8); }
  return c;
}
void main(){
  ivec2 q = ivec2(gl_FragCoord.xy);
  vec3 c = background(gl_FragCoord.xy / size);
  if (sh != vec2(0.)) { float d = distU(q - ivec2(int(sh.x), -int(sh.y))); float a = clamp(sw + 1. - d, 0., 1.) * 0.85; c = mix(c, vec3(20., 6., 40.) / 255., a); }
  if (sw > 0.) { float d = distU(q); float a = clamp(sw + 0.5 - d, 0., 1.); c = mix(c, vec3(12., 10., 30.) / 255., a); }
  vec4 obj = texelFetch(tObj, q, 0);
  c = c * (1. - obj.a) + obj.rgb;
  o = vec4(c, 1.);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let progObj, progComp, src = null, params = null, bg = 0;
const tex = {};
let fbo = null, fboTex = null;
try {
  if (!gl) throw new Error("WebGL 2 not available");
  progObj = program(FS_OBJ); progComp = program(FS_COMP);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
} catch (e) { msg.textContent = "GPU preview unavailable: " + e.message; send({ type: "error", error: String(e.message || e) }); }

function b64ToBytes(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function upload(name, data, w, h, isFloat) {
  if (!tex[name]) tex[name] = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex[name]);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  if (isFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, w, h, 0, gl.RED, gl.FLOAT, data);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, w, h, 0, gl.RED, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

function setSource(m) {
  const t0 = performance.now();
  src = m;
  canvas.width = m.w; canvas.height = m.h;
  upload("a", b64ToBytes(m.alpha), m.w, m.h, false);
  upload("in", new Float32Array(b64ToBytes(m.dIn).buffer), m.w, m.h, true);
  upload("out", new Float32Array(b64ToBytes(m.dOut).buffer), m.w, m.h, true);
  upload("sdf", new Float32Array(b64ToBytes(m.sdfS).buffer), m.w, m.h, true);
  if (!fboTex) { fboTex = gl.createTexture(); fbo = gl.createFramebuffer(); }
  gl.bindTexture(gl.TEXTURE_2D, fboTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, m.w, m.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  msg.textContent = "";
  send({ type: "sourceLoaded", ms: Math.round(performance.now() - t0), w: m.w, h: m.h });
  render();
}

function uni(p, name) { return gl.getUniformLocation(p, name); }
function render() {
  if (!src || !params || !progObj) return;
  const t0 = performance.now();
  const P = params, box = src.box, textH = box.h;
  const vp = [box.x0 + P.vpX / 100 * box.w, box.y0 + P.vpY / 100 * box.h];
  const ramp = (RAMPS[P.material] || RAMPS.chrome).flatMap(([u, c]) => [u, ((c >> 16) & 255) / 255, ((c >> 8) & 255) / 255, (c & 255) / 255]);
  gl.viewport(0, 0, src.w, src.h);
  // pass 1
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.useProgram(progObj);
  const bind = (unit, t, name) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex[t]); gl.uniform1i(uni(progObj, name), unit); };
  bind(0, "a", "tA"); bind(1, "in", "tIn"); bind(2, "out", "tOut"); bind(3, "sdf", "tSdf");
  gl.uniform2f(uni(progObj, "size"), src.w, src.h);
  gl.uniform2f(uni(progObj, "vp"), vp[0], vp[1]);
  gl.uniform1f(uni(progObj, "s"), P.depth / 100);
  gl.uniform1f(uni(progObj, "B"), Math.max(2, P.bevel / 100 * textH));
  gl.uniform1f(uni(progObj, "top"), box.y0);
  gl.uniform1f(uni(progObj, "textH"), textH);
  gl.uniform1f(uni(progObj, "scale"), textH / 300);
  gl.uniform1f(uni(progObj, "edgeK"), P.edgeLine / 100);
  gl.uniform1i(uni(progObj, "profile"), P.profile === "round" ? 1 : 0);
  gl.uniform4fv(uni(progObj, "ramp"), new Float32Array(ramp));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // pass 2
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(uni(progComp, "tObj"), 0);
  const sw = P.stroke > 0 ? Math.max(1.5, P.stroke / 100 * textH) : 0;
  gl.uniform2f(uni(progComp, "size"), src.w, src.h);
  gl.uniform1f(uni(progComp, "sw"), sw);
  gl.uniform2f(uni(progComp, "sh"), Math.round(P.shadowX / 100 * textH), Math.round(P.shadowY / 100 * textH));
  gl.uniform1i(uni(progComp, "R"), Math.min(24, Math.ceil(sw + 2)));
  gl.uniform1i(uni(progComp, "bg"), bg);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // wait for GPU
  send({ type: "rendered", ms: +(performance.now() - t0).toFixed(1) });
}

window.addEventListener("message", (e) => {
  let m = e.data;
  for (let k = 0; k < 3 && typeof m === "string"; k++) { try { m = JSON.parse(m); } catch (err) { break; } }
  if (!m || !m.cmd) return;
  try {
    if (m.cmd === "ping") send({ type: "pong" });
    else if (m.cmd === "source") setSource(m);
    else if (m.cmd === "params") { params = m.params; bg = m.bg | 0; render(); }
    else if (m.cmd === "clear") { src = null; gl.clearColor(0.11, 0.11, 0.11, 1); gl.clear(gl.COLOR_BUFFER_BIT); msg.textContent = m.text || ""; }
  } catch (err) { send({ type: "error", error: String(err.message || err) }); }
});
send({ type: "ready" });
</script>
</body>
</html>
